<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyChef Netlify Form Detection</title>
</head>
<body>
  <!-- Netlify Form Detection Target -->
  <form name="contact-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact-inquiry" />
    <input type="text" name="bot-field" />
    <input type="text" name="category" />
    <input type="text" name="fullName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="city" />
    <input type="text" name="pincode" />
    <input type="text" name="organizationName" />
    <input type="text" name="estimatedMealsCount" />
    <input type="text" name="dietaryPreference" />
    <input type="text" name="startDate" />
    <input type="text" name="kitchenType" />
    <input type="text" name="hasFssai" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>

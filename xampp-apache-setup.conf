# ==============================================================================
# MyChef - XAMPP Apache Reverse Proxy Configuration
# ==============================================================================
# This configuration connects your XAMPP Apache Server (Port 80)
# to your Next.js application running on http://localhost:3000/
#
# STEP 1: Open XAMPP -> Apache -> Config -> httpd.conf
# Ensure the following lines are UNCOMMENTED (remove the leading #):
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#   LoadModule rewrite_module modules/mod_rewrite.so
#   Include conf/extra/httpd-vhosts.conf
#
# STEP 2: Paste the VirtualHost block below at the bottom of:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# STEP 3: Restart Apache in XAMPP Control Panel.
# ==============================================================================

<VirtualHost *:80>
    ServerName localhost
    # Or use: ServerName mychef.local
    ServerAlias www.mychef.local

    # Forward client IP and original headers
    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket Proxy for Next.js Fast Refresh & Live Sync
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://localhost:3000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://localhost:3000/$1 [P,L]

    # HTTP Proxy to Next.js
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # Security & Performance Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog "logs/mychef-error.log"
    CustomLog "logs/mychef-access.log" common
</VirtualHost>
